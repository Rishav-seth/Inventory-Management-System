services:
  - type: web
    name: inventory-management-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL
        value: https://inventory-management-system-frontend-0s7m.onrender.com

  - type: web
    name: inventory-management-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: client/dist
    envVars:
      - key: VITE_API_URL
        value: https://inventory-management-system-api-kuyo.onrender.com
